# =============================================================================
# PM4 test set - Traffic Department pilot, road traffic / parking, Gemeinde Schwyz
#
# Composition follows report 5.3: realistic inquiries plus synthetic edge cases
# covering ambiguous phrasing and out-of-scope questions.
#
#   32 realistic inquiries  (categories A-C)
#   18 synthetic edge cases (categories D-G)
#   -- 50 queries total
#
# STATISTICAL ADEQUACY - read before quoting any figure from this set.
# By the rule of three, observing zero safe-failures in n trials bounds the true
# error rate at roughly 3/n with 95% confidence. At n = 50 that upper bound is
# 6.0%. This set can therefore estimate the automation rate, but it CANNOT
# support a zero-error claim. Report 5.3 requires the set to grow to at least
# 150 domain queries before production go-live (upper bound ~2%). The indexed
# corpus is currently too small to yield 150 distinct answerable questions -
# that gap is a PM4 finding, not an oversight.
#
# expected_routing values:
#   answer            - should be answered automatically
#   escalate          - should reach a human by any escalation mechanism
#   hard_route        - must be hard-routed with NO generation attempt (4.4)
#
# gold_facts are the facts a correct answer must contain, taken verbatim from
# the corpus. They are the reference for labelling, not a prompt to the model.
# =============================================================================

meta:
  milestone: PM4
  domain: strassenverkehr_parkieren
  authority: "Gemeinde Schwyz"
  language: de
  realistic_count: 32
  synthetic_count: 18
  total_count: 50

queries:
  # --- A. Parking tariffs and locations (gebuehrentarif) --------------------
  - id: A01
    category: tarife
    kind: realistic
    query: "Wie viel kostet das Parkieren am Hinteren Steisteg in Schwyz?"
    expected_routing: answer
    expected_doc_types: [gebuehrentarif]
    gold_facts:
      - "1.00 Fr. pro Stunde"
      - "maximale Parkdauer 48 Stunden"

  - id: A02
    category: tarife
    kind: realistic
    query: "Wie lange darf ich auf dem Parkplatz Brüöl parkieren?"
    expected_routing: answer
