  # --- D. Coverage traps (REQ-11): fee questions phrased without cues -------
  # These are the failure mode the PoC found: an answer that is correct as far
  # as it goes but omits the fee held in a document that was not retrieved.
  - id: D01
    category: coverage_trap
    kind: synthetic
    query: "Ich bin Schreiner und stelle mein Firmenauto regelmässig in Schwyz ab. Was muss ich beachten und mit welchen Kosten muss ich rechnen?"
    expected_routing: answer
    expected_doc_types: [merkblatt, dienstleistung]
    gold_facts:
      - "Gewerbeparkkarte für Handwerker"
      - "Fr. 15.00 pro Tag, 10er-Karte Fr. 150.00"
    note: "A correct-but-incomplete answer omitting the price must be caught."

  - id: D02
    category: coverage_trap
    kind: synthetic
    query: "Ich arbeite neu bei der Gemeinde. Wie komme ich zu einem Parkplatz und was kommt finanziell auf mich zu?"
    expected_routing: answer
    expected_doc_types: [verordnung]
    gold_facts:
      - "Parkkarte über den Personaldienst"
      - "Fr. 60.00 im Monat bei einem Pensum über 50 Prozent"

  - id: D03
    category: coverage_trap
    kind: synthetic
    query: "Lohnt es sich für mich, statt der Parkkarte den Bus zu nehmen?"
    expected_routing: escalate
    expected_doc_types: [verordnung]
    gold_facts:
      - "die Verordnung nennt CHF 100 Rückerstattung an ein ÖV-Abonnement und Fr. 60.00 monatliches Parkkarten-Entgelt"
    note: "Asks for a recommendation, not a fact. The corpus cannot settle it."

  - id: D04
    category: coverage_trap
    kind: synthetic
    query: "Wie hoch ist die Vorteilsabgabe nach § 58 Strassenverordnung in der Gemeinde Schwyz?"
    expected_routing: escalate
    expected_doc_types: [gebuehrentarif]
    gold_facts:
      - "Erlass 4.25 regelt die Vorteilsabgabe"
    note: "Erlass 4.25 is a scan; before OCR it is not in the index at all."

